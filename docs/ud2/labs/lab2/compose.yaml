services:
  # Objetivo de la auditoría: un servidor web con una versión concreta de nginx.
  servidor:
    image: nginx:1.18.0
    networks:
      - laboratorio

  # El auditor escanea al servidor. Corre como root y permanece vivo.
  auditor:
    build: .
    depends_on:
      - servidor
    networks:
      - laboratorio

networks:
  laboratorio:
